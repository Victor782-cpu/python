{% extends 'base.html' %}
{% block content %}
<div class="alert alert-info">
    <i class="bi bi-quote"></i> <strong>Frase do dia:</strong> {{ frase }}
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Minhas Tarefas</h2>
    <a href="{{ url_for('nova_tarefa') }}" class="btn btn-success"><i class="bi bi-plus-lg"></i> Nova Tarefa</a>
</div>

<div class="row mb-4">
    <div class="col-md-4">
        <select id="filtroStatus" class="form-select">
            <option value="">Todos os status</option>
            <option value="Pendente">Pendente</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Concluída">Concluída</option>
        </select>
    </div>
</div>

<div class="row" id="listaTarefas">
    {% for t in tarefas %}
    <div class="col-md-4 mb-3">
        <div class="card {% if t.status == 'Pendente' %}border-warning{% elif t.status == 'Em andamento' %}border-primary{% else %}border-success{% endif %}">
            <div class="card-body">
                <h5 class="card-title">{{ t.titulo }}</h5>
                <p class="card-text">{{ t.descricao }}</p>
                <span class="badge {% if t.status == 'Pendente' %}text-bg-warning{% elif t.status == 'Em andamento' %}text-bg-primary{% else %}text-bg-success{% endif %}">
                    {{ t.status }}
                </span>
                <div class="mt-3">
                    <a href="{{ url_for('editar_tarefa', id=t.id) }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                    <a href="{{ url_for('excluir_tarefa', id=t.id) }}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
