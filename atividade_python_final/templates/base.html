<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">Gerenciador de Tarefas</a>
            {% if session.get('usuario_id') %}
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('progresso') }}" class="btn btn-outline-light btn-sm">Gráficos</a>
                <button class="btn btn-sm btn-secondary" id="toggleDarkMode"><i class="bi bi-moon-fill"></i></button>
                <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">Sair</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
